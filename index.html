<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WrtS - Mesajlaşma</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 h-screen flex flex-col justify-between">

    <!-- Giriş Ekranı -->
    <div id="auth-screen" class="fixed inset-0 bg-slate-950 z-50 flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 p-8 rounded-2xl shadow-2xl w-full max-w-md space-y-6">
            <h1 class="text-3xl font-extrabold text-center text-indigo-400">WrtS'ye Giriş</h1>
            
            <form id="auth-form" class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">E-posta</label>
                    <input type="email" id="email" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Şifre</label>
                    <input type="password" id="password" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-indigo-500">
                </div>
                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3 rounded-xl text-sm transition">Giriş Yap / Kayıt Ol</button>
            </form>

            <button id="google-login" class="w-full bg-white hover:bg-slate-100 text-slate-900 font-semibold py-3 rounded-xl text-sm transition flex items-center justify-center gap-2">
                <span>Google ile Devam Et</span>
            </button>
        </div>
    </div>

    <!-- Sohbet Başlığı -->
    <header class="bg-slate-900 border-b border-slate-800 p-4 flex justify-between items-center">
        <div class="flex items-center gap-3">
            <img id="user-avatar" src="https://via.placeholder.com/40" class="w-9 h-9 rounded-full object-cover border border-indigo-500">
            <div>
                <h2 id="user-name" class="font-bold text-sm">Kullanıcı</h2>
                <span class="text-xs text-emerald-400">● Çevrimiçi</span>
            </div>
        </div>
        <button id="logout-btn" class="text-xs bg-red-500/10 text-red-400 hover:bg-red-500/20 px-3 py-1.5 rounded-lg transition">Çıkış Yap</button>
    </header>

    <!-- Mesajlaşma Alanı -->
    <div id="chat-container" class="flex-1 overflow-y-auto p-4 space-y-3 max-w-2xl w-full mx-auto">
        <!-- Mesajlar buraya gelecek -->
    </div>

    <!-- Mesaj Yazma Çubuğu -->
    <div class="bg-slate-900 border-t border-slate-800 p-4 max-w-2xl w-full mx-auto">
        <form id="chat-form" class="flex items-center gap-2">
            <input type="text" id="msg-input" placeholder="Mesajınızı yazın..." autocomplete="off" class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-indigo-500">
            <button type="submit" class="bg-indigo-600 hover:bg-indigo-500 text-white px-5 py-3 rounded-xl text-sm font-semibold transition">Gönder</button>
        </form>
    </div>

    <!-- Firebase Kodları -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getDatabase, ref, push, onChildAdded } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCz5KvCtJFPgmk-7bLWY-aIoGz1MXMGrWg",
            authDomain: "wrts-46aaf.firebaseapp.com",
            databaseURL: "https://wrts-46aaf-default-rtdb.firebaseio.com",
            projectId: "wrts-46aaf",
            storageBucket: "wrts-46aaf.firebasestorage.app",
            messagingSenderId: "627981661221",
            appId: "1:627981661221:web:5635a97ba39a9032cb7bcc",
            measurementId: "G-X75D7H3N9X"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        const authScreen = document.getElementById('auth-screen');
        const authForm = document.getElementById('auth-form');
        const googleLoginBtn = document.getElementById('google-login');
        const logoutBtn = document.getElementById('logout-btn');
        const chatForm = document.getElementById('chat-form');
        const msgInput = document.getElementById('msg-input');
        const chatContainer = document.getElementById('chat-container');
        const userNameEl = document.getElementById('user-name');
        const userAvatarEl = document.getElementById('user-avatar');

        let currentUser = null;

        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                authScreen.classList.add('hidden');
                userNameEl.textContent = user.displayName || user.email.split('@')[0];
                userAvatarEl.src = user.photoURL || 'https://via.placeholder.com/40';
            } else {
                currentUser = null;
                authScreen.classList.remove('hidden');
            }
        });

        authForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            try {
                await signInWithEmailAndPassword(auth, email, password);
            } catch (error) {
                try {
                    await createUserWithEmailAndPassword(auth, email, password);
                } catch (err) {
                    alert('Hata: ' + err.message);
                }
            }
        });

        googleLoginBtn.addEventListener('click', async () => {
            try {
                await signInWithPopup(auth, new GoogleAuthProvider());
            } catch (error) {
                alert('Google Giriş Hatası: ' + error.message);
            }
        });

        logoutBtn.addEventListener('click', () => signOut(auth));

        chatForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const text = msgInput.value.trim();
            if (!text || !currentUser) return;

            push(ref(db, 'messages'), {
                uid: currentUser.uid,
                name: currentUser.displayName || currentUser.email.split('@')[0],
                text: text,
                timestamp: Date.now()
            });

            msgInput.value = '';
        });

        onChildAdded(ref(db, 'messages'), (snapshot) => {
            const data = snapshot.val();
            const isMe = currentUser && data.uid === currentUser.uid;

            const div = document.createElement('div');
            div.className = `flex flex-col ${isMe ? 'items-end' : 'items-start'}`;
            div.innerHTML = `
                <span class="text-[10px] text-slate-400 mb-1">${data.name}</span>
                <div class="${isMe ? 'bg-indigo-600 text-white' : 'bg-slate-900 border border-slate-800 text-slate-200'} px-4 py-2.5 rounded-2xl max-w-xs break-words text-sm shadow-sm">
                    ${data.text}
                </div>
            `;
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        });
    </script>
</body>
</html>
