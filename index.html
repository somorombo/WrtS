<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WrtS - Sohbet Platformu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <style>
        body { overscroll-behavior-y: none; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    </style>
</head>
<body class="bg-slate-950 text-white h-[100dvh] w-full overflow-hidden flex flex-col justify-between">

    <!-- GİRİŞ EKRANI -->
    <div id="login-screen" class="fixed inset-0 bg-slate-950 z-50 flex items-center justify-center p-4 overflow-y-auto">
        <div class="bg-slate-900 border border-slate-800 p-6 sm:p-8 rounded-2xl w-full max-w-sm space-y-5 shadow-2xl">
            <h1 class="text-3xl font-black text-center text-indigo-400">WrtS</h1>
            <form id="email-form" class="space-y-3">
                <input type="email" id="email" placeholder="E-posta" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-base sm:text-sm focus:outline-none focus:border-indigo-500">
                <input type="password" id="password" placeholder="Şifre (En az 6 karakter)" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-base sm:text-sm focus:outline-none focus:border-indigo-500">
                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 py-3 rounded-xl font-bold text-sm transition">Giriş Yap / Kayıt Ol</button>
            </form>
            <div class="text-center text-xs text-slate-500">veya</div>
            <button id="google-btn" type="button" class="w-full bg-white text-slate-900 hover:bg-slate-200 py-3 rounded-xl font-bold text-sm transition flex items-center justify-center gap-2">
                <svg class="w-4 h-4" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
                <span>Google ile Giriş Yap</span>
            </button>
            <p id="auth-error" class="text-xs text-red-400 text-center hidden"></p>
        </div>
    </div>

    <!-- PROFİL DÜZENLEME MODALI -->
    <div id="profile-modal" class="fixed inset-0 bg-black/80 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6 w-full max-w-sm space-y-4 shadow-2xl">
            <div class="flex justify-between items-center">
                <h3 class="text-lg font-bold">Profil Ayarları</h3>
                <button id="close-profile" class="text-slate-400 hover:text-white">✕</button>
            </div>
            <div>
                <label class="block text-xs text-slate-400 mb-1">Görünen Ad</label>
                <input type="text" id="edit-name" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-indigo-500">
            </div>
            <div>
                <label class="block text-xs text-slate-400 mb-1">Avatar URL (İsteğe bağlı resim linki)</label>
                <input type="text" id="edit-avatar" placeholder="https://..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-indigo-500">
            </div>
            <div class="flex gap-2 pt-2">
                <button id="save-profile" class="flex-1 bg-indigo-600 hover:bg-indigo-500 py-2.5 rounded-xl text-sm font-bold">Kaydet</button>
                <button id="modal-logout" class="bg-red-500/20 text-red-400 px-4 py-2.5 rounded-xl text-sm font-bold">Çıkış</button>
            </div>
        </div>
    </div>

    <!-- ÜST BAR VE ODALAR -->
    <header class="bg-slate-900 border-b border-slate-800 px-3 py-3 sm:p-4 flex justify-between items-center gap-2 shrink-0">
        <div class="flex items-center gap-2 min-w-0">
            <span class="font-black text-lg sm:text-xl text-indigo-400 shrink-0">WrtS</span>
            <select id="room-select" class="bg-slate-950 border border-slate-800 text-xs sm:text-sm rounded-lg px-2 py-1.5 text-indigo-300 font-semibold focus:outline-none truncate">
                <option value="genel"># Genel</option>
                <option value="sohbet"># Muhabbet</option>
                <option value="oyun"># Oyun</option>
            </select>
        </div>
        <button id="open-profile" class="flex items-center gap-2 bg-slate-800/60 hover:bg-slate-800 px-3 py-1.5 rounded-full border border-slate-700 transition max-w-[150px]">
            <img id="header-avatar" src="" class="w-5 h-5 rounded-full object-cover shrink-0">
            <span id="user-display" class="text-xs text-slate-200 truncate font-medium"></span>
        </button>
    </header>

    <!-- MESAJ ALANI -->
    <main id="messages" class="flex-1 overflow-y-auto p-3 sm:p-4 space-y-3 max-w-2xl w-full mx-auto">
    </main>

    <!-- MESAJ GÖNDERME ÇUBUĞU -->
    <footer class="bg-slate-900 border-t border-slate-800 p-2.5 sm:p-4 max-w-2xl w-full mx-auto shrink-0">
        <form id="msg-form" class="flex items-center gap-2 w-full">
            <input type="text" id="msg-input" placeholder="Bir şeyler yaz..." autocomplete="off" class="flex-1 min-w-0 bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 sm:py-3 text-base sm:text-sm focus:outline-none focus:border-indigo-500">
            <button type="submit" class="bg-indigo-600 hover:bg-indigo-500 px-5 sm:px-6 py-2.5 sm:py-3 rounded-xl font-bold text-sm shrink-0">Gönder</button>
        </form>
    </footer>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCz5KvCtJFPgmk-7bLWY-aIoGz1MXMGrWg",
            authDomain: "wrts-46aaf.firebaseapp.com",
            databaseURL: "https://wrts-46aaf-default-rtdb.firebaseio.com",
            projectId: "wrts-46aaf",
            storageBucket: "wrts-46aaf.firebasestorage.app",
            messagingSenderId: "627981661221",
            appId: "1:627981661221:web:5635a97ba39a9032cb7bcc"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();

        const loginScreen = document.getElementById('login-screen');
        const authError = document.getElementById('auth-error');
        const messagesDiv = document.getElementById('messages');
        const roomSelect = document.getElementById('room-select');
        
        let currentUser = null;
        let currentRoom = 'genel';
        let roomRef = null;

        // Oturum Durumu & Yerel Profil Hafızası
        auth.onAuthStateChanged(user => {
            if (user) {
                currentUser = user;
                loginScreen.classList.add('hidden');
                
                // Kayıtlı özel isim/avatar var mı kontrol et
                const savedName = localStorage.getItem('wrts_name_' + user.uid) || user.displayName || user.email.split('@')[0];
                const savedAvatar = localStorage.getItem('wrts_avatar_' + user.uid) || user.photoURL || `https://ui-avatars.com/api/?name=${encodeURIComponent(savedName)}&background=4f46e5&color=fff`;

                document.getElementById('user-display').textContent = savedName;
                document.getElementById('header-avatar').src = savedAvatar;
                document.getElementById('edit-name').value = savedName;
                document.getElementById('edit-avatar').value = localStorage.getItem('wrts_avatar_' + user.uid) || '';

                loadRoom(currentRoom);
            } else {
                currentUser = null;
                loginScreen.classList.remove('hidden');
            }
        });

        // Profil Modalı İşlemleri
        document.getElementById('open-profile').addEventListener('click', () => document.getElementById('profile-modal').classList.remove('hidden'));
        document.getElementById('close-profile').addEventListener('click', () => document.getElementById('profile-modal').classList.add('hidden'));
        document.getElementById('modal-logout').addEventListener('click', () => auth.signOut());

        document.getElementById('save-profile').addEventListener('click', () => {
            const newName = document.getElementById('edit-name').value.trim();
            const newAvatar = document.getElementById('edit-avatar').value.trim();
            if(!newName) return alert("İsim boş olamaz!");

            localStorage.setItem('wrts_name_' + currentUser.uid, newName);
            if(newAvatar) localStorage.setItem('wrts_avatar_' + currentUser.uid, newAvatar);

            document.getElementById('user-display').textContent = newName;
            if(newAvatar) document.getElementById('header-avatar').src = newAvatar;
            document.getElementById('profile-modal').classList.add('hidden');
        });

        // Giriş İşlemleri
        function showError(msg) { authError.textContent = msg; authError.classList.remove('hidden'); }
        document.getElementById('google-btn').addEventListener('click', () => {
            auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(err => showError(err.message));
        });
        document.getElementById('email-form').addEventListener('submit', e => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const pass = document.getElementById('password').value;
            auth.signInWithEmailAndPassword(email, pass).catch(() => {
                auth.createUserWithEmailAndPassword(email, pass).catch(err => showError(err.message));
            });
        });

        // Odalar
        roomSelect.addEventListener('change', e => {
            currentRoom = e.target.value;
            loadRoom(currentRoom);
        });

        function loadRoom(room) {
            if (roomRef) roomRef.off();
            messagesDiv.innerHTML = '';
            roomRef = db.ref('odalar/' + room).limitToLast(50);
            
            roomRef.on('child_added', snap => {
                const data = snap.val();
                const key = snap.key;
                const isMe = currentUser && data.uid === currentUser.uid;
                
                const div = document.createElement('div');
                div.id = `msg-${key}`;
                div.className = `flex gap-2 ${isMe ? 'flex-row-reverse' : 'flex-row'} items-end`;

                // Emojileri hazırla
                let reactionsHTML = '';
                if(data.reactions) {
                    Object.values(data.reactions).forEach(emoji => {
                        reactionsHTML += `<span class="bg-slate-900/80 text-xs px-1.5 py-0.5 rounded-full border border-slate-700">${emoji}</span>`;
                    });
                }

                div.innerHTML = `
                    <img src="${data.avatar || 'https://ui-avatars.com/api/?name=U'}" class="w-6 h-6 rounded-full object-cover shrink-0 mb-1">
                    <div class="flex flex-col ${isMe ? 'items-end' : 'items-start'} max-w-[75%]">
                        <span class="text-[10px] text-slate-400 mb-0.5 px-1">${data.isim}</span>
                        <div class="relative group ${isMe ? 'bg-indigo-600' : 'bg-slate-800'} px-3.5 py-2 rounded-2xl shadow">
                            <p class="text-sm break-words">${data.mesaj}</p>
                            
                            <!-- Emoji Ekleme ve Silme Butonları -->
                            <div class="absolute -bottom-3 ${isMe ? 'right-2' : 'left-2'} flex gap-1 items-center opacity-0 group-hover:opacity-100 transition">
                                <button onclick="addReaction('${room}', '${key}', '👍')" class="bg-slate-800 hover:bg-slate-700 text-xs px-1 rounded shadow">👍</button>
                                <button onclick="addReaction('${room}', '${key}', '❤️')" class="bg-slate-800 hover:bg-slate-700 text-xs px-1 rounded shadow">❤️</button>
                                <button onclick="addReaction('${room}', '${key}', '🔥')" class="bg-slate-800 hover:bg-slate-700 text-xs px-1 rounded shadow">🔥</button>
                                ${isMe ? `<button onclick="deleteMsg('${room}', '${key}')" class="bg-red-600 text-white rounded-full w-4 h-4 text-[10px] flex items-center justify-center shadow ml-1">×</button>` : ''}
                            </div>
                        </div>
                        <div class="flex gap-1 mt-1 flex-wrap">${reactionsHTML}</div>
                    </div>
                `;
                messagesDiv.appendChild(div);
                messagesDiv.scrollTop = messagesDiv.scrollHeight;
            });
        }

        window.deleteMsg = function(room, key) {
            if(confirm("Bu mesajı silmek istiyor musun?")) {
                db.ref(`odalar/${room}/${key}`).remove();
                document.getElementById(`msg-${key}`)?.remove();
            }
        };

        window.addReaction = function(room, key, emoji) {
            if(!currentUser) return;
            db.ref(`odalar/${room}/${key}/reactions/${currentUser.uid}`).set(emoji);
        };

        // Realtime Tepki Dinleyici
        // (Tepki eklendiğinde mesajı günceller)
        // ... (Veritabanı zaten anlık senkronizedir)

        // Mesaj Gönderme
        document.getElementById('msg-form').addEventListener('submit', e => {
            e.preventDefault();
            const input = document.getElementById('msg-input');
            const text = input.value.trim();
            if(!text || !currentUser) return;

            const currentName = localStorage.getItem('wrts_name_' + currentUser.uid) || currentUser.displayName || currentUser.email.split('@')[0];
            const currentAvatar = localStorage.getItem('wrts_avatar_' + currentUser.uid) || currentUser.photoURL || `https://ui-avatars.com/api/?name=${encodeURIComponent(currentName)}&background=4f46e5&color=fff`;

            db.ref('odalar/' + currentRoom).push({
                uid: currentUser.uid,
                isim: currentName,
                avatar: currentAvatar,
                mesaj: text,
                zaman: Date.now()
            });
            input.value = '';
        });
    </script>
</body>
</html>
