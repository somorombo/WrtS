<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WrtS - Ultimate Full Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <style>
        body { 
            overscroll-behavior-y: none; 
            background: radial-gradient(circle at top right, #2e0916, #14050a 45%, #090306 100%);
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-thumb { background: #e11d48; border-radius: 4px; }
        pre code { font-family: 'Courier New', Courier, monospace; }
        
        @keyframes championGlow {
            0% { border-color: #f59e0b; box-shadow: 0 0 8px rgba(245,158,11,0.6); }
            50% { border-color: #fb7185; box-shadow: 0 0 18px rgba(251,113,133,0.9); }
            100% { border-color: #f59e0b; box-shadow: 0 0 8px rgba(245,158,11,0.6); }
        }
        .champion-ring { border: 2.5px solid #f59e0b !important; animation: championGlow 2s infinite; }

        @keyframes messageHighlight {
            0% { background-color: rgba(245, 158, 11, 0.6); }
            100% { background-color: transparent; }
        }
        .highlight-anim { animation: messageHighlight 2s ease-out; }

        @keyframes snowfall {
            0% { transform: translateY(-10px) translateX(0); opacity: 0.8; }
            100% { transform: translateY(100vh) translateX(15px); opacity: 0.2; }
        }
        .snowflake { position: absolute; top: -10px; background: #ffe4e6; border-radius: 50%; pointer-events: none; z-index: 5; animation: snowfall linear infinite; }

        @keyframes riseUp {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-100vh) scale(0.4); opacity: 0; }
