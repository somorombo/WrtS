<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WrtS - Sohbet Platformu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <style>
        body { overscroll-behavior-y: none; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    </style>
</head>
<body class="bg-slate-950 text-white h-[100dvh] w-full overflow-hidden flex flex-col justify-between">

    <!-- GİRİŞ EKRANI -->
    <div id="login-screen" class="fixed inset-0 bg-slate-950 z-50 flex items-center justify-center p-4 overflow-y-auto">
        <div class="bg-slate-900 border border-slate-800 p-6 sm:p-8 rounded-2xl w-full max-w-sm space-y-5 shadow-2xl">
            <h1 class="text-3xl font-black text-center text-indigo-400">WrtS</h1>
            <form id="email-form" class="space-y-3">
                <input type="email" id="email" placeholder="E-posta" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-base sm:text-sm focus:outline-none focus:border-indigo-500">
                <input type="password" id="password" placeholder="Şifre (En az 6 karakter)" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-base sm:text-sm focus:outline-none focus:border-indigo-500">
                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 py-3 rounded-xl font-bold text-sm transition">Giriş Yap / Kayıt Ol</button>
            </form>
            <div class="text-center text-xs text-slate-500">veya</div>
            <button id="google-btn" type="button" class="w-full bg-white text-slate-900 hover:bg-slate-200 py-3 rounded-xl font-bold text-sm transition flex items-center justify-center gap-2">
                <svg class="w-4 h-4" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
                <span>Google ile Giriş Yap</span>
            </button>
            <p id="auth-error" class="text-xs text-red-400 text-center hidden"></p>
        </div>
    </div>

    <!-- KULLANICILAR VE DM MODALI -->
    <div id="users-modal" class="fixed inset-0 bg-black/80 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6 w-full max-w-sm space-y-4 shadow-2xl max-h-[85vh] overflow-y-auto">
            <div class="flex justify-between items-center sticky top-0 bg-slate-900 pb-2 border-b border-slate-800">
                <h3 class="text-lg font-bold">Kullanıcılar & DM</h3>
                <button id="close-users-modal" class="text-slate-400 hover:text-white font-bold px-2 py-1">✕</button>
            </div>
            <div>
                <h4 class="text-xs font-bold text-indigo-400 uppercase tracking-wider mb-2">👥 Sohbet Eden Kullanıcılar (DM)</h4>
                <div id="all-users-list" class="space-y-2">
                    <p class="text-xs text-slate-500 italic">Yükleniyor...</p>
                </div>
            </div>
        </div>
    </div>

    <!-- YENİ ODA OLUŞTURMA MODALI -->
    <div id="room-modal" class="fixed inset-0 bg-black/80 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6 w-full max-w-sm space-y-4 shadow-2xl">
            <div class="flex justify-between items-center">
                <h3 class="text-lg font-bold">Yeni Oda Oluştur</h3>
                <button id="close-room-modal" class="text-slate-400 hover:text-white">✕</button>
            </div>
            <div>
                <label class="block text-xs text-slate-400 mb-1">Oda Adı</label>
                <input type="text" id="new-room-name" placeholder="Örn: Müzik, Gece Tayfa..." maxlength="20" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-base sm:text-sm focus:outline-none focus:border-indigo-500">
            </div>
            <button id="create-room-btn" class="w-full bg-indigo-600 hover:bg-indigo-500 py-2.5 rounded-xl text-sm font-bold transition">Odayı Kur</button>
        </div>
    </div>

    <!-- PROFİL DÜZENLEME MODALI -->
    <div id="profile-modal" class="fixed inset-0 bg-black/80 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6 w-full max-w-sm space-y-4 shadow-2xl">
            <div class="flex justify-between items-center">
                <h3 class="text-lg font-bold">Profil Ayarları</h3>
                <button id="close-profile" class="text-slate-400 hover:text-white">✕</button>
            </div>
            
            <div class="flex flex-col items-center gap-2">
                <img id="preview-avatar" src="" class="w-20 h-20 rounded-full object-cover border-2 border-indigo-500 shadow-md">
                <input type="file" id="upload-avatar-file" accept="image/*" class="hidden">
                <button type="button" onclick="document.getElementById('upload-avatar-file').click()" class="bg-slate-800 hover:bg-slate-700 text-xs px-3 py-1.5 rounded-lg border border-slate-700 transition">Cihazdan Fotoğraf Seç</button>
            </div>

            <div>
                <label class="block text-xs text-slate-400 mb-1">Görünen Ad</label>
                <input type="text" id="edit-name" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-base sm:text-sm focus:outline-none focus:border-indigo-500">
            </div>
            <div>
                <label class="block text-xs text-slate-400 mb-1">Hakkında / Açıklama</label>
                <input type="text" id="edit-bio" placeholder="Örn: WrtS kullanıcısı..." maxlength="60" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-base sm:text-sm focus:outline-none focus:border-indigo-500">
            </div>
            <div class="flex gap-2 pt-2">
                <button id="save-profile" class="flex-1 bg-indigo-600 hover:bg-indigo-500 py-2.5 rounded-xl text-sm font-bold transition">Kaydet</button>
                <button id="modal-logout" class="bg-red-500/20 text-red-400 px-4 py-2.5 rounded-xl text-sm font-bold transition">Çıkış</button>
            </div>
        </div>
    </div>

    <!-- ÜST BAR VE ODALAR -->
    <header class="bg-slate-900 border-b border-slate-800 px-3 py-3 sm:p-4 flex justify-between items-center gap-2 shrink-0">
        <div class="flex items-center gap-1.5 sm:gap-2 min-w-0">
            <span class="font-black text-lg sm:text-xl text-indigo-400 shrink-0">WrtS</span>
            <select id="room-select" class="bg-slate-950 border border-slate-800 text-xs sm:text-sm rounded-lg px-2 py-1.5 text-indigo-300 font-semibold focus:outline-none truncate max-w-[110px] sm:max-w-[150px]">
                <option value="genel"># Genel</option>
                <option value="sohbet"># Muhabbet</option>
                <option value="oyun"># Oyun</option>
            </select>
            <button id="open-room-modal" class="bg-indigo-600/20 hover:bg-indigo-600/40 text-indigo-400 border border-indigo-500/30 w-7 h-7 rounded-lg flex items-center justify-center font-bold text-base shrink-0 transition" title="Yeni Oda Kur">+</button>
            <button id="delete-room-btn" class="hidden bg-red-500/20 hover:bg-red-500/30 text-red-400 border border-red-500/30 w-7 h-7 rounded-lg flex items-center justify-center text-xs shrink-0 transition" title="Bu Odayı Sil">🗑️</button>
        </div>
        <div class="flex items-center gap-2">
            <button id="open-users-btn" class="bg-slate-800/60 hover:bg-slate-800 px-2.5 py-1.5 rounded-full border border-slate-700 text-xs text-indigo-300 flex items-center gap-1.5 shrink-0" title="Kullanıcılar">
                👥 DM
            </button>
            <button id="open-profile" class="flex items-center gap-2 bg-slate-800/60 hover:bg-slate-800 px-2.5 py-1.5 rounded-full border border-slate-700 transition max-w-[120px] sm:max-w-[150px] shrink-0">
                <img id="header-avatar" src="" class="w-5 h-5 rounded-full object-cover shrink-0">
                <span id="user-display" class="text-xs text-slate-200 truncate font-medium"></span>
            </button>
        </div>
    </header>

    <!-- MESAJ ALANI -->
    <main id="messages" class="flex-1 overflow-y-auto p-3 sm:p-4 space-y-4 max-w-2xl w-full mx-auto">
    </main>

    <!-- YAZIYOR GÖSTERGESİ -->
    <div id="typing-indicator" class="px-4 py-1 text-[11px] text-slate-400 italic max-w-2xl w-full mx-auto h-5 shrink-0">
    </div>

    <!-- MESAJ GÖNDERME ÇUBUĞU -->
    <footer class="bg-slate-900 border-t border-slate-800 p-2.5 sm:p-4 max-w-2xl w-full mx-auto shrink-0">
        <form id="msg-form" class="flex items-center gap-2 w-full">
            <button type="button" onclick="document.getElementById('img-file').click()" class="p-2 text-slate-400 hover:text-indigo-400 bg-slate-800/60 rounded-full transition shrink-0" title="Fotoğraf Gönder">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
            </button>
            <input type="file" id="img-file" accept="image/*" class="hidden">

            <button type="button" id="record-btn" class="p-2 text-slate-400 hover:text-rose-400 bg-slate-800/60 rounded-full transition shrink-0" title="Ses Kaydet">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path></svg>
            </button>

            <input type="text" id="msg-input" placeholder="Bir şeyler yaz..." autocomplete="off" class="flex-1 min-w-0 bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 sm:py-3 text-base sm:text-sm focus:outline-none focus:border-indigo-500">
            <button type="submit" class="bg-indigo-600 hover:bg-indigo-500 px-4 sm:px-6 py-2.5 sm:py-3 rounded-xl font-bold text-sm shrink-0">Gönder</button>
        </form>
    </footer>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCz5KvCtJFPgmk-7bLWY-aIoGz1MXMGrWg",
            authDomain: "wrts-46aaf.firebaseapp.com",
            databaseURL: "https://wrts-46aaf-default-rtdb.firebaseio.com",
            projectId: "wrts-46aaf",
            storageBucket: "wrts-46aaf.firebasestorage.app",
            messagingSenderId: "627981661221",
            appId: "1:627981661221:web:5635a97ba39a9032cb7bcc"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();

        const loginScreen = document.getElementById('login-screen');
        const authError = document.getElementById('auth-error');
        const messagesDiv = document.getElementById('messages');
        const roomSelect = document.getElementById('room-select');
        const deleteRoomBtn = document.getElementById('delete-room-btn');
        const typingIndicator = document.getElementById('typing-indicator');
        
        let currentUser = null;
        let currentRoom = 'genel';
        let roomRef = null;
        let customRoomsData = {};
        let tempBase64Avatar = null;
        let typingTimeout = null;
        const defaultRooms = ['genel', 'sohbet', 'oyun'];

        // Giriş Durumu (Asla takılmaz, anında ekranı açar)
        auth.onAuthStateChanged(user => {
            if (user) {
                currentUser = user;
                loginScreen.classList.add('hidden');
                
                loadUserDataToUI();
                listenRooms();
                loadRoom(currentRoom);
                listenTyping();
            } else {
                currentUser = null;
                loginScreen.classList.remove('hidden');
            }
        });

        function getMyData() {
            if (!currentUser) return { name: "Kullanıcı", avatar: "", bio: "" };
            const name = localStorage.getItem('wrts_name_' + currentUser.uid) || currentUser.displayName || currentUser.email.split('@')[0];
            const avatar = localStorage.getItem('wrts_avatar_' + currentUser.uid) || currentUser.photoURL || `https://ui-avatars.com/api/?name=${encodeURIComponent(name)}&background=4f46e5&color=fff`;
            const bio = localStorage.getItem('wrts_bio_' + currentUser.uid) || 'WrtS kullanıcısı.';
            return { name, avatar, bio };
        }

        function loadUserDataToUI() {
            const data = getMyData();
            document.getElementById('user-display').textContent = data.name;
            document.getElementById('header-avatar').src = data.avatar;
            document.getElementById('preview-avatar').src = data.avatar;
            document.getElementById('edit-name').value = data.name;
            document.getElementById('edit-bio').value = data.bio;
            tempBase64Avatar = null;
        }

        document.getElementById('upload-avatar-file').addEventListener('change', e => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const MAX = 150;
                    let w = img.width, h = img.height;
                    if (w > h) { if (w > MAX) { h *= MAX / w; w = MAX; } }
                    else { if (h > MAX) { w *= MAX / h; h = MAX; } }
                    canvas.width = w; canvas.height = h;
                    canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                    tempBase64Avatar = canvas.toDataURL('image/jpeg', 0.7);
                    document.getElementById('preview-avatar').src = tempBase64Avatar;
                }
                img.src = event.target.result;
            }
            reader.readAsDataURL(file);
        });

        document.getElementById('open-profile').addEventListener('click', () => document.getElementById('profile-modal').classList.remove('hidden'));
        document.getElementById('close-profile').addEventListener('click', () => document.getElementById('profile-modal').classList.add('hidden'));
        document.getElementById('modal-logout').addEventListener('click', () => auth.signOut());

        document.getElementById('save-profile').addEventListener('click', () => {
            const newName = document.getElementById('edit-name').value.trim();
            const newBio = document.getElementById('edit-bio').value.trim();
            if(!newName) return alert("İsim boş olamaz!");

            localStorage.setItem('wrts_name_' + currentUser.uid, newName);
            localStorage.setItem('wrts_bio_' + currentUser.uid, newBio || 'WrtS kullanıcısı.');
            if(tempBase64Avatar) localStorage.setItem('wrts_avatar_' + currentUser.uid, tempBase64Avatar);

            loadUserDataToUI();
            document.getElementById('profile-modal').classList.add('hidden');
        });

        // Tüm Kullanıcıları ve DM Başlatmayı Mesajlaşanlardan Bulma
        document.getElementById('open-users-btn').addEventListener('click', () => {
            document.getElementById('users-modal').classList.remove('hidden');
            loadActiveUsersList();
        });
        document.getElementById('close-users-modal').addEventListener('click', () => document.getElementById('users-modal').classList.add('hidden'));

        function loadActiveUsersList() {
            const allDiv = document.getElementById('all-users-list');
            allDiv.innerHTML = '<p class="text-xs text-slate-500">Kullanıcılar taranıyor...</p>';

            // Tüm odalardaki mesajlardan daha önce yazmış olan kullanıcıları topla
            db.ref('odalar').once('value', snap => {
                const rooms = snap.val() || {};
                const usersMap = {};

                Object.values(rooms).forEach(roomMsgs => {
                    if (roomMsgs) {
                        Object.values(roomMsgs).forEach(msg => {
                            if (msg.uid && msg.isim) {
                                usersMap[msg.uid] = {
                                    name: msg.isim,
                                    avatar: msg.avatar || '',
                                    bio: msg.bio || ''
                                };
                            }
                        });
                    }
                });

                allDiv.innerHTML = '';
                const entries = Object.entries(usersMap);

                if (entries.length === 0) {
                    allDiv.innerHTML = '<p class="text-xs text-slate-500">Henüz başka aktif kullanıcı bulunamadı. Mesaj atarak görünür olabilirsiniz.</p>';
                    return;
                }

                entries.forEach(([uid, info]) => {
                    if (currentUser && uid === currentUser.uid) return;

                    const item = document.createElement('div');
                    item.className = "flex items-center justify-between bg-slate-950 p-2.5 rounded-xl border border-slate-800 hover:border-indigo-500 transition";
                    item.innerHTML = `
                        <div class="flex items-center gap-2.5">
                            <img src="${info.avatar || 'https://ui-avatars.com/api/?name=U'}" class="w-7 h-7 rounded-full object-cover">
                            <div>
                                <p class="text-xs font-bold text-slate-200">${info.name}</p>
                                <span class="text-[10px] text-slate-400">${info.bio}</span>
                            </div>
                        </div>
                        <button onclick="startDM('${uid}', '${encodeURIComponent(info.name)}')" class="text-xs bg-indigo-600/20 hover:bg-indigo-600/40 text-indigo-400 px-2.5 py-1 rounded-lg border border-indigo-500/30 font-bold transition">DM Başlat</button>
                    `;
                    allDiv.appendChild(item);
                });
            });
        }

        window.startDM = function(targetUid, encodedTargetName) {
            const targetName = decodeURIComponent(encodedTargetName);
            const ids = [currentUser.uid, targetUid].sort();
            const dmRoomId = `dm_${ids[0]}_${ids[1]}`;
            
            db.ref('oda_listesi/' + dmRoomId).set({
                name: `DM: ${targetName}`,
                creator: currentUser.uid,
                createdAt: Date.now()
            });

            currentRoom = dmRoomId;
            roomSelect.value = dmRoomId;
            document.getElementById('users-modal').classList.add('hidden');
            loadRoom(dmRoomId);
        }

        function listenRooms() {
            db.ref('oda_listesi').on('value', snap => {
                customRoomsData = snap.val() || {};
                const prev = currentRoom;

                roomSelect.innerHTML = `
                    <option value="genel"># Genel</option>
                    <option value="sohbet"># Muhabbet</option>
                    <option value="oyun"># Oyun</option>
                `;

                Object.entries(customRoomsData).forEach(([id, info]) => {
